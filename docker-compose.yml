services:
  postgres:
    image: postgres:16-alpine
    container_name: fireticket-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fireticket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fireticket}
      POSTGRES_DB: ${POSTGRES_DB:-fireticket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fireticket} -d $${POSTGRES_DB:-fireticket}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fireticket-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fireticket}:${POSTGRES_PASSWORD:-fireticket}@postgres:5432/${POSTGRES_DB:-fireticket}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-fire-ticket-secret-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://ticket.webbea.qa}
      AUTH_TRUST_HOST: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-FireTicket <noreply@fireticket.com>}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SYNOLOGY_FOLDER_PATH: ${SYNOLOGY_FOLDER_PATH:-/synology}
    volumes:
      - ${SYNOLOGY_FOLDER:-./synology_data}:/synology
    ports:
      - "127.0.0.1:${PORT_BIND:-3005}:3000"

volumes:
  postgres_data:
